[project]
name = "ministere-de-l-info"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mathias", email = "bertinotti16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.102.0",
    "duckdb>=1.5.2",
    "feedparser>=6.0.12",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests-cache>=1.3.2",
    "streamlit>=1.57.0",
    "streamlit-folium>=0.27.2",
]

[project.scripts]
ministere-de-l-info = "ministere_de_l_info:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
