[project]
name = "ministere-de-l-info"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mathias", email = "bertinotti16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.2",
    "feedparser>=6.0.12",
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests-cache>=1.3.2",
    "streamlit>=1.57.0",
    "streamlit-folium>=0.27.2",
]

[project.scripts]
ministere-de-l-info = "ministere_de_l_info:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "requests>=2.32.0",
    "ruff>=0.15.13",
]
ai = [
    "anthropic>=0.102.0",
]
etl = [
    "geopandas>=1.1.3",
]

[tool.pytest.ini_options]
addopts = [
    "-m", "not slow",
    "--cov=src/ministere_de_l_info",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=60",
    "--cov-config=pyproject.toml",
]
markers = [
    "slow: tests démarant un processus externe (Streamlit). Lancer avec: pytest -m slow",
]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "*/etl/loaders/*",
    "*/etl/schema.py",
    "*/etl/views.py",
    "*/etl/_common.py",
    # Pages Streamlit et modules de requêtes DB-dépendants :
    # testés via AppTest/fixtures avec DB présente uniquement.
    # elections_queries.py et elections_legi_queries.py ne sont pas
    # exclus car leur couverture partielle sans DB suffisait jusqu'à D3.2.
    # TODO : télécharger la DB en CI via actions/cache (deploy workstream)
    # et retirer ces exclusions pour retrouver la couverture réelle ~69%.
    "*/pages/elections_presidentielles.py",
    "*/pages/elections_legislatives.py",
    "*/pages/elections_municipales.py",
    "*/viz/elections_muni_queries.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".claude",
    ".venv",
    "data",
    "notebooks",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
]
ignore = [
    "E501",  # line too long (géré par formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
