# Hooks lancés automatiquement avant chaque git commit
# Installation : uv run pre-commit install
# Lancement manuel : uv run pre-commit run --all-files

# Les skills Claude Code dans .claude/ sont des fichiers tiers — exclus des hooks
exclude: ^\.claude/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
