services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ministere-de-l-info:dev
    container_name: ministere-de-l-info
    ports:
      - "8501:8501"
    volumes:
      # Hot reload : code source monté en lecture
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./.streamlit:/app/.streamlit
      # DB locale montée en lecture seule (dev) : pas de rebuild quand la DB change
      # En prod, la DB est intégrée à l'image — voir docker-compose.prod.yml
      - ./data:/app/data:ro
      # Pages Streamlit (hot reload)
      - ./pages:/app/pages:ro
      # Référentiels (lecture seule)
      - ./references:/app/references:ro
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - LOG_FORMAT=json
    restart: unless-stopped
